
<style>
  /* ПАНЕЛЬ ПОЛЬЗОВАТЕЛЯ (СНИЗУ СЛЕВА) */
  .user-container {
    background: #232428;
    padding: 6px 8px;
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: auto; /* Прижимаем к самому низу боковой панели */
    height: 52px;
  }

  .user-avatar-small {
    width: 32px;
    height: 32px;
    background: #5865F2;
    border-radius: 50%;
    position: relative;
    cursor: pointer;
  }

  /* Зеленый статус "В сети" на аватарке */
  .status-indicator {
    width: 10px;
    height: 10px;
    background: #23a55a;
    border-radius: 50%;
    position: absolute;
    bottom: 0;
    right: 0;
    border: 2px solid #232428;
  }

  .user-details {
    flex: 1;
    font-size: 13px;
    line-height: 1.2;
    cursor: pointer;
    overflow: hidden;
  }

  .user-details b { color: white; display: block; white-space: nowrap; text-overflow: ellipsis; }
  .user-details span { color: #b5bac1; font-size: 11px; }

  /* КНОПКИ МИКРОФОНА И НАУШНИКОВ */
  .user-actions {
    display: flex;
    gap: 2px;
  }

  .action-icon {
    width: 32px;
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 4px;
    cursor: pointer;
    color: #b5bac1;
    font-size: 18px;
    transition: 0.1s;
  }

  .action-icon:hover {
    background: #3f4147;
    color: #dbdee1;
  }

  /* Стиль для МУТА (красный перечеркнутый) */
  .action-icon.muted {
    color: #f23f42;
  }
</style>

<!-- РАЗМЕТКА ПАНЕЛИ -->
<div class="user-container">
  <div class="user-avatar-small">
    <div class="status-indicator"></div>
  </div>
  
  <div class="user-details" onclick="window.location.href='settings.html'">
    <b>Dheed_TOP</b>
    <span>#0001</span>
  </div>

  <div class="user-actions">
    <!-- Кнопка Микрофона -->
    <div class="action-icon" id="mic-btn" title="Выключить микрофон" onclick="toggleMic()">🎤</div>
    
    <!-- Кнопка Наушников -->
    <div class="action-icon" id="head-btn" title="Выключить звук" onclick="toggleAudio()">🎧</div>
    
    <!-- Кнопка Настроек -->
    <div class="action-icon" title="Настройки пользователя" onclick="window.location.href='settings.html'">⚙️</div>
  </div>
</div>

<script>
  // ЛОГИКА ДЛЯ МУТА МИКРОФОНА
  function toggleMic() {
    const btn = document.getElementById('mic-btn');
    btn.classList.toggle('muted');
    
    if (btn.classList.contains('muted')) {
      btn.innerText = '🔇'; // Иконка выключенного
      btn.title = 'Включить микрофон';
    } else {
      btn.innerText = '🎤'; // Иконка включенного
      btn.title = 'Выключить микрофон';
    }
  }

  // ЛОГИКА ДЛЯ ГЛУШЕНИЯ НАУШНИКОВ
  function toggleAudio() {
    const btn = document.getElementById('head-btn');
    btn.classList.toggle('muted');
    
    if (btn.classList.contains('muted')) {
      btn.innerText = '❌'; // Иконка выключенного звука
      btn.title = 'Включить звук';
    } else {
      btn.innerText = '🎧'; // Иконка включенного звука
      btn.title = 'Выключить звук';
    }
  }
</script>
