<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="Voice Gamer — голосовой чат и звонки для геймеров.">
    <title>Voice Gamer</title>
    <style>
        body { margin: 0; display: flex; height: 100vh; font-family: sans-serif; background: #313338; color: white; overflow: hidden; }
        .sidebar { width: 240px; background: #2b2d31; padding: 20px; display: flex; flex-direction: column; border-right: 1px solid #1e1f22; }
        .btn-call { background: #248046; color: white; border: none; padding: 12px; border-radius: 5px; cursor: pointer; font-weight: bold; margin-top: 20px; transition: 0.2s; }
        .btn-call:hover { background: #1a6334; }
        #call-frame { width: 100%; height: 400px; border: none; margin-top: 10px; display: none; background: #000; border-radius: 8px; }
        .chat-area { flex: 1; padding: 20px; display: flex; flex-direction: column; }
    </style>
</head>
<body>
    <div class="sidebar">
        <h3>Voice Gamer</h3>
        <button class="btn-call" onclick="startCall()">📞 НАЧАТЬ ЗВОНОК</button>
        <!-- Окно звонка появится здесь -->
        <iframe id="call-frame" allow="microphone; camera; display-capture; autoplay"></iframe>
    </div>
    <div class="chat-area">
        <p><b>Система:</b> Сайт запущен! Нажми на кнопку слева, чтобы начать звонок.</p>
    </div>

    <script>
        function startCall() {
            const frame = document.getElementById('call-frame');
            // Твоя комната для связи
             frame.src = "https://meet.jit.si";
          frame.style.display = "block";
        }
    </script>
</body>
</html>
